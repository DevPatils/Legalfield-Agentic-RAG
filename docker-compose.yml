services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: arl-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: arl-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  qdrant_storage:
  mongo_data:
